<script>
const DUR = 6.0;
const svg   = document.getElementById("svg");
const flare = document.getElementById("flare");
const tG    = [...document.querySelectorAll(".t-glyph")];
const sG    = [...document.querySelectorAll(".s-glyph")];
const rule  = document.getElementById("rule");
const lockup= document.getElementById("lockup");

const clamp = (v,a=0,b=1) => Math.min(b, Math.max(a, v));
const ease  = t => 1 - Math.pow(1 - clamp(t), 3);          // outCubic
const span  = (t,a,b) => clamp((t - a) / (b - a));

// glyphs are duplicated across the glow / shadow / fill groups, so drive them by index
const byIndex = (list, n) => {
  const out = Array.from({length:n}, () => []);
  list.forEach(el => out[+el.dataset.i].push(el));
  return out;
};
const TITLE = byIndex(tG, 8), SUB = byIndex(sG, 8);

function render(t) {
  // --- the streak: strikes, sweeps wide, then burns off -----------------
  const fIn  = span(t, 0.10, 0.42), fOut = span(t, 0.55, 1.45);
  const fw   = 0.04 + 0.96 * ease(fIn);
  flare.setAttribute("opacity", (Math.min(1, fIn * 2.2) * (1 - fOut)).toFixed(3));
  flare.setAttribute("transform", `translate(960 0) scale(${fw.toFixed(4)} ${(0.6 + 2.2*(1-fOut)).toFixed(3)}) translate(-960 0)`);

  // --- DRIVE-IN resolves out of the flare, letter by letter -------------
  TITLE.forEach((els, i) => {
    const p = ease(span(t, 0.40 + i * 0.055, 1.15 + i * 0.055));
    const o = p, dy = (1 - p) * 14, sc = 1 + (1 - p) * 0.012;
    els.forEach(el => {
      el.style.opacity = o.toFixed(3);
      el.style.filter  = p < 0.995 ? `blur(${((1 - p) * 13).toFixed(2)}px)` : "";
      el.style.transform = `translate(0px, ${dy.toFixed(2)}px) scale(${sc.toFixed(4)})`;
      el.style.transformOrigin = "960px 648px";
    });
  });

  // --- the rule lights from its centre outward --------------------------
  const rp = ease(span(t, 1.00, 1.85));
  rule.setAttribute("opacity", rp.toFixed(3));
  rule.setAttribute("transform", `translate(960 0) scale(${(0.02 + 0.98*rp).toFixed(4)} 1) translate(-960 0)`);

  // --- PICTURES arrives on the wide track -------------------------------
  SUB.forEach((els, i) => {
    const p = ease(span(t, 1.55 + i * 0.06, 2.15 + i * 0.06));
    els.forEach(el => { el.style.opacity = p.toFixed(3); });
  });

  // --- hold: a slow bloom breath, a little gate weave, then out ---------
  const breathe = 1 + 0.010 * Math.sin((t - 2.2) * 1.5);
  const weaveX  = Math.sin(t * 8.7) * 0.5 + Math.sin(t * 3.1) * 0.35;
  const weaveY  = Math.cos(t * 6.3) * 0.4;
  const out     = 1 - span(t, DUR - 0.7, DUR - 0.05);
  lockup.setAttribute("transform",
    `translate(${(960 + weaveX).toFixed(2)} ${(540 + weaveY).toFixed(2)}) ` +
    `scale(${(t > 2.2 ? breathe : 1).toFixed(4)}) translate(-960 -540)`);
  svg.style.opacity = out.toFixed(3);
}

window.setTime = render;
render(0);

const scrub = document.getElementById("scrub");
scrub.addEventListener("input", () => { playing = false; render(+scrub.value); });

let playing = true, t0 = null;
function loop(ts) {
  if (playing) {
    if (t0 === null) t0 = ts;
    let t = (ts - t0) / 1000;
    if (t > DUR + 0.6) { t0 = ts; t = 0; }
    render(Math.min(t, DUR));
    scrub.value = Math.min(t, DUR);
  }
  requestAnimationFrame(loop);
}
if (!location.search.includes("static")) requestAnimationFrame(loop);
else playing = false;
document.addEventListener("click", () => { playing = !playing; t0 = null; });
document.documentElement.dataset.ready = "1";
</script>
