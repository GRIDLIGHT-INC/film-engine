<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Previs side panel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div style="width: 232px; height: 808px; box-sizing: border-box; display: flex; flex-direction: column; background: #151517; border: 1px solid rgba(255,255,255,0.07); border-radius: 18px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; color: #f4f4f5;">
  <div style="padding: 15px 15px 12px; border-bottom: 1px solid rgba(255,255,255,0.07);">
    <div style="font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: #8e8e97; margin-bottom: 5px;">Phase 2 of 4</div>
    <div style="font-size: 17px; font-weight: 600; letter-spacing: -0.015em;">Plan</div>
  </div>
  <div style="padding: 8px 8px 6px; display: flex; flex-wrap: wrap; gap: 3px; border-bottom: 1px solid rgba(255,255,255,0.07);">
    <sc-for list="{{pages}}" as="p" hint-placeholder-count="6">
      <button style="height: 26px; padding: 0 9px; border-radius: 8px; border: 1px solid {{p.bd}}; background: {{p.bg}}; color: {{p.fg}}; font: {{p.fw}} 11.5px -apple-system, sans-serif;">{{p.name}}</button>
    </sc-for>
  </div>
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 14px 6px; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #8e8e97;"><span>Shots in this world</span><span style="opacity: 0.6;">6</span></div>
  <div style="flex: 1; overflow: hidden; padding: 0 8px; display: flex; flex-direction: column; gap: 4px;">
    <sc-for list="{{shots}}" as="s" hint-placeholder-count="6">
      <div style="display: flex; gap: 9px; align-items: center; padding: 6px; border-radius: 10px; background: {{s.bg}}; border: 1px solid {{s.bd}};">
        <div style="width: 64px; height: 36px; flex-shrink: 0; border-radius: 5px; background: {{s.thumb}}; position: relative; overflow: hidden;">
          <div style="position: absolute; left: {{s.fx}}; top: 6px; width: 10px; height: 24px; border-radius: 3px; background: rgba(0,0,0,0.35);"></div>
        </div>
        <div style="flex: 1; min-width: 0;">
          <div style="display: flex; align-items: center; gap: 5px;"><span style="font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 11.5px; font-weight: 600; color: {{s.fg}};">{{s.code}}</span><span style="font-size: 10px; color: {{s.stc}};">{{s.state}}</span></div>
          <div style="font-size: 11px; color: #a3a3ab; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{s.name}}</div>
        </div>
      </div>
    </sc-for>
  </div>
  <div style="padding: 10px 8px 12px; border-top: 1px solid rgba(255,255,255,0.07); display: flex; gap: 6px;">
    <button style="flex: 1; height: 30px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); background: #232327; color: #c9c9d0; font: 500 11.5px -apple-system, sans-serif;">+ Shot here</button>
    <button style="flex: 1; height: 30px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); background: #232327; color: #c9c9d0; font: 500 11.5px -apple-system, sans-serif;">New world</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sel":{"editor":"text","default":"1B"},"$preview":{"width":232,"height":808}}'>
class Component extends DCLogic {
  renderVals() {
    const sel = this.props.sel ?? '1B';
    const pages = ['Deliverables', 'Storyboard', 'Previs', 'Consistency', 'Milestones', 'Budget'].map(n => ({
      name: n,
      bg: n === 'Previs' ? '#141d3f' : 'transparent',
      bd: n === 'Previs' ? 'rgba(102,144,255,0.55)' : 'rgba(255,255,255,0.06)',
      fg: n === 'Previs' ? '#ffffff' : '#a3a3ab',
      fw: n === 'Previs' ? '600' : '400'
    }));
    const rows = [
      ['1A', 'Wide — the diner at last light', 'locked', '#8a6a48', '58%'],
      ['1B', 'Two-shot, the booth', 'applied', '#7a3a30', '70%'],
      ['1C', 'June, single', 'trying', '#6a4a44', '40%'],
      ['1D', 'Ray, single', 'trying', '#6a5440', '45%'],
      ['1E', 'Insert — his hands', 'empty', '#3a3a40', '50%'],
      ['1F', 'Over Ray, onto June', 'applied', '#5c3a34', '62%']
    ];
    const stateLabel = { locked: '● locked', applied: '✓ applied', trying: '○ trying', empty: 'not blocked' };
    const stateCol = { locked: '#4fd39c', applied: '#9fb6ff', trying: '#e0a33e', empty: '#6f6f77' };
    const shots = rows.map(([code, name, st, thumb, fx]) => ({
      code, name, thumb, fx,
      state: stateLabel[st], stc: stateCol[st],
      fg: code === sel ? '#ffffff' : '#e7e7ea',
      bg: code === sel ? '#141d3f' : 'transparent',
      bd: code === sel ? 'rgba(102,144,255,0.55)' : 'transparent'
    }));
    return { pages, shots };
  }
}
</script>
</body>
</html>
